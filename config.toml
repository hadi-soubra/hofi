[display]
columns       = 3
window_width  = 600
window_height = 400
card_ratio    = 1.45
spacing       = 10
padding       = 12
# no window_x / window_y → centered in the free screen area, same spot as rofi
font_size     = 13

[steam]
enabled   = true
steamapps = "~/.steam/steam/steamapps"
# SteamGridDB key → set env var SGDB_KEY (do not put the key here)

[heroic]
enabled       = true
legendary_dir = "~/.config/heroic/legendaryConfig/legendary"

[pcsx2]
enabled    = true
emulator   = "pcsx2-qt"
game_dirs  = ["~/PS2games"]
slow_boot  = true   # boot through the BIOS (PS2 startup animation) first
extensions = ["iso", "bin", "img", "mdf", "nrg"]

[custom]
enabled = true

[[custom.sources]]
name       = "Pirated"
tag        = "WIN"
dirs       = ["~/pgames"]
extensions = ["exe", "sh"]
launch     = "wine {path}"

[[custom.entries]]
title  = "Minecraft"
tag    = "MC"
dir    = "/usr/games/tlauncher"
launch = "/usr/games/tlauncher/lib/jvm/jre/bin/java -Dfile.encoding=UTF8 -jar /usr/games/tlauncher/starter-core.jar"
cover  = "~/holder/Projects/hofi/assets/minecraft.png"
